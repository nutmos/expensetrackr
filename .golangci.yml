version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - misspell
    - unconvert
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # De Morgan rewrites of char-range checks read worse than the original.
      - linters: [staticcheck]
        text: "QF1001:"
    paths:
      - pkg/apidoc/swagger-ui

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
  exclusions:
    paths:
      - pkg/apidoc/swagger-ui
