        fields:
          currency: '"XYZ" is not a recognised ISO 4217 currency code'
          spent_at: must be an RFC 3339 / ISO 8601 date-time with a timezone offset, e.g. 2026-10-06T21:06:00+08:00
    ErrTxCurrencyMismatch:
      summary: Currency differs from the balance's
      value:
        error: validation failed
        fields:
          balance_uid: 'balance "KBank debit" is in THB but the transaction is in USD; the currencies must match (no exchange-rate conversion yet)'
    ErrTxAdjustmentType:
      summary: type balance_adjustment is not writable
      value:
        error: validation failed
        fields:
          type: 'balance_adjustment transactions are created automatically when a balance amount is edited (PUT /api/balances/:uid); they cannot be created or changed here'
    ErrTxVersionConflict:
      summary: Stale version
      value:
        error: 'version conflict: this transaction was changed since you read it (now at version 2); nothing was saved. Reload it, re-apply your change and send the new version'
        fields: { version: is stale; the current version is 2 }
        code: version_conflict
        current:
