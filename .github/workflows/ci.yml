name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Builds the server image from the Dockerfile (what `make up` and the
      # expensetrackr-run-server skill use), so a broken Dockerfile fails CI.
      - run: docker build --pull -t expensetrackr:ci .
      - run: docker run --rm --entrypoint /usr/local/bin/expense-server expensetrackr:ci -h 2>&1 | grep -q database-url

  fmt-check:
    name: Format check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt-check

  vet:
    name: Vet
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vet

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    # Postgres for the store and API tests (compose.yaml is the local
    # equivalent; each test uses its own schema, see pkg/store/storetest).
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U expense -d expense_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      EXPENSE_TEST_DATABASE_URL: postgres://expense:expense@localhost:5432/expense_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      # The store and API tests again, with encryption at rest on
      # (docs/encryption.md): every encrypted column goes through its
      # seal/open path.
      - name: Test with encryption at rest
        run: EXPENSE_TEST_ENCRYPTION_KEY="$(openssl rand -base64 32)" go test ./pkg/store/... ./pkg/api/...

  race:
    name: Test (race detector)
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U expense -d expense_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "1"
      EXPENSE_TEST_DATABASE_URL: postgres://expense:expense@localhost:5432/expense_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-race

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  # The one check the `main` ruleset requires (.github/rulesets/main.json,
  # issue #210): it fails when any job above failed or was cancelled, so a
  # pull request with a failing build, test, vet, format or lint run cannot
  # be merged. Requiring this single check (instead of each job) keeps the
  # ruleset valid when jobs are added or renamed.
  ci-passed:
    name: CI passed
    if: always()
    needs: [build, docker, fmt-check, vet, test, race, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::Jobs did not succeed: $failed"
            exit 1
          fi
