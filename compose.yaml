# Local stack: Postgres ("db") and the expensetrackr server ("app", built from
# the Dockerfile). docs/getting-started.md: "Run with Docker Compose" and
# "Local Postgres".
#
#   make up         build and start both; wait until the server is healthy
#                   (http://127.0.0.1:8080, EXPENSE_PORT to change it)
#   make down       stop both (data stays in the "pgdata" volume)
#   make logs       follow the server's logs
#   make db-up      start only Postgres (for `make run` / `make test`)
#   make db-reset   stop everything and delete the volume (all local data)
#   make db-psql    open psql on the development database
#
# Credentials are for local use only; ports are bound to 127.0.0.1.
name: expensetrackr

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expense
    ports:
      - "127.0.0.1:${EXPENSE_PG_PORT:-5432}:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18.
      - pgdata:/var/lib/postgresql
      # Runs once, when the volume is created: adds the test database.
      - ./dev/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: expensetrackr:local
    environment:
      # "db" is the Postgres service above, on the compose network.
      EXPENSE_DATABASE_URL: postgres://expense:expense@db:5432/expense?sslmode=disable
      EXPENSE_FX_URL: ${EXPENSE_FX_URL:-https://api.frankfurter.dev/v1}
    ports:
      - "127.0.0.1:${EXPENSE_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Health check: the Dockerfile's HEALTHCHECK (GET /api/healthz).

volumes:
  pgdata:
