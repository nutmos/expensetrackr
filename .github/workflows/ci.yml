name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make build

  fmt-check:
    name: Format check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt-check

  vet:
    name: Vet
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vet

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    # Postgres for the store and API tests (compose.yaml is the local
    # equivalent; each test uses its own schema, see pkg/store/storetest).
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U expense -d expense_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      EXPENSE_TEST_DATABASE_URL: postgres://expense:expense@localhost:5432/expense_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test

  race:
    name: Test (race detector)
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U expense -d expense_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      CGO_ENABLED: "1"
      EXPENSE_TEST_DATABASE_URL: postgres://expense:expense@localhost:5432/expense_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-race

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
